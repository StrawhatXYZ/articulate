name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (ROS 2 Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/ai-robotics-lab

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          # Build and test dependencies only; the simulator and GUI tools
          # (Gazebo, RViz) are runtime dependencies the tests do not need.
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy \
            --dependency-types buildtool \
            --dependency-types build \
            --dependency-types test
          apt-get install -y --no-install-recommends python3-colcon-common-extensions

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

  lint:
    name: Lint shell scripts and Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck ./*.sh scripts/*.sh

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
