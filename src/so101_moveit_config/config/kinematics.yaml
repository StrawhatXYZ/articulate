# IK for RViz's interactive marker and pose goals. pick_ik copes with the
# 5-DOF arm, which cannot reach every orientation; the lab's tasks use their
# own vertical-approach IK and send joint goals.
arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  mode: global
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.001
  orientation_threshold: 0.01
  cost_threshold: 0.001
  minimal_displacement_weight: 0.0
  gd_step_size: 0.0001
