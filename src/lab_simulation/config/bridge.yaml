# ros_gz_bridge topic map for the table world.
#
# Each entry connects one Gazebo transport topic to one ROS 2 topic.
# direction: GZ_TO_ROS (simulator output) or ROS_TO_GZ (commands).

# Simulation clock, required for use_sim_time.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# Joint feedback from the JointStatePublisher system.
- ros_topic_name: /joint_states
  gz_topic_name: /world/table_world/model/simple_arm/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# Position targets (radians) for each JointPositionController.
- ros_topic_name: /simple_arm/joint_1/cmd_pos
  gz_topic_name: /simple_arm/joint_1/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /simple_arm/joint_2/cmd_pos
  gz_topic_name: /simple_arm/joint_2/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /simple_arm/joint_3/cmd_pos
  gz_topic_name: /simple_arm/joint_3/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

# Live world pose of each piece, from its PosePublisher (one topic per piece:
# the combined pose stream loses entity names when bridged).
- ros_topic_name: /lab/pieces/red_cube/pose
  gz_topic_name: /model/red_cube/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS

- ros_topic_name: /lab/pieces/blue_cylinder/pose
  gz_topic_name: /model/blue_cylinder/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS

- ros_topic_name: /lab/pieces/green_block/pose
  gz_topic_name: /model/green_block/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS

# Suction: engage or release one piece (see table_world.sdf).
- ros_topic_name: /simple_arm/suction/red_cube/attach
  gz_topic_name: /simple_arm/suction/red_cube/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /simple_arm/suction/red_cube/detach
  gz_topic_name: /simple_arm/suction/red_cube/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /simple_arm/suction/blue_cylinder/attach
  gz_topic_name: /simple_arm/suction/blue_cylinder/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /simple_arm/suction/blue_cylinder/detach
  gz_topic_name: /simple_arm/suction/blue_cylinder/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /simple_arm/suction/green_block/attach
  gz_topic_name: /simple_arm/suction/green_block/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /simple_arm/suction/green_block/detach
  gz_topic_name: /simple_arm/suction/green_block/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

# Suction state: "attached" or "detached", published when it changes.
- ros_topic_name: /simple_arm/suction/red_cube/state
  gz_topic_name: /simple_arm/suction/red_cube/state
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS

- ros_topic_name: /simple_arm/suction/blue_cylinder/state
  gz_topic_name: /simple_arm/suction/blue_cylinder/state
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS

- ros_topic_name: /simple_arm/suction/green_block/state
  gz_topic_name: /simple_arm/suction/green_block/state
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS

# Scene reset: teleport a model (benchmark only).
- service_name: /world/table_world/set_pose
  ros_type_name: ros_gz_interfaces/srv/SetEntityPose
  gz_req_type_name: gz.msgs.Pose
  gz_rep_type_name: gz.msgs.Boolean
