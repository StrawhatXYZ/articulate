# ros_gz_bridge topic map for the table world.
#
# Each entry connects one Gazebo transport topic to one ROS 2 topic.
# direction: GZ_TO_ROS (simulator output) or ROS_TO_GZ (commands).
# Joint states and joint commands do not pass through the bridge: the arm
# runs ros2_control inside Gazebo (gz_ros2_control).

# Simulation clock, required for use_sim_time.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# Live world pose of each piece, from its PosePublisher (one topic per piece:
# the combined pose stream loses entity names when bridged).
- ros_topic_name: /lab/pieces/red_cube/pose
  gz_topic_name: /model/red_cube/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS

- ros_topic_name: /lab/pieces/blue_cylinder/pose
  gz_topic_name: /model/blue_cylinder/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS

- ros_topic_name: /lab/pieces/green_block/pose
  gz_topic_name: /model/green_block/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS

# Grasp latch: lock a gripped piece to the gripper, or release it
# (see urdf/lab_so101.urdf.xacro).
- ros_topic_name: /lab/latch/red_cube/attach
  gz_topic_name: /lab/latch/red_cube/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /lab/latch/red_cube/detach
  gz_topic_name: /lab/latch/red_cube/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /lab/latch/blue_cylinder/attach
  gz_topic_name: /lab/latch/blue_cylinder/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /lab/latch/blue_cylinder/detach
  gz_topic_name: /lab/latch/blue_cylinder/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /lab/latch/green_block/attach
  gz_topic_name: /lab/latch/green_block/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

- ros_topic_name: /lab/latch/green_block/detach
  gz_topic_name: /lab/latch/green_block/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ

# Latch state: "attached" or "detached", published when it changes.
- ros_topic_name: /lab/latch/red_cube/state
  gz_topic_name: /lab/latch/red_cube/state
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS

- ros_topic_name: /lab/latch/blue_cylinder/state
  gz_topic_name: /lab/latch/blue_cylinder/state
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS

- ros_topic_name: /lab/latch/green_block/state
  gz_topic_name: /lab/latch/green_block/state
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS

# Scene reset: teleport a model (benchmark only).
- service_name: /world/table_world/set_pose
  ros_type_name: ros_gz_interfaces/srv/SetEntityPose
  gz_req_type_name: gz.msgs.Pose
  gz_rep_type_name: gz.msgs.Boolean
